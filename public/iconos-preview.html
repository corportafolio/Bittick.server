<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Elegir ícono oportunidades</title>
<style>
  body { background:#1A1A1A; color:#fff; font-family:system-ui,sans-serif; padding:40px; max-width:900px; margin:0 auto; }
  h1 { color:#F7931A; margin-bottom:10px; }
  .grid { display:grid; grid-template-columns:repeat(5,1fr); gap:20px; margin-top:30px; }
  .card { background:#252525; border:2px solid #333; border-radius:12px; padding:30px 15px; text-align:center; cursor:pointer; transition:all .2s; }
  .card:hover { border-color:#F7931A; }
  .card svg { width:48px; height:48px; margin-bottom:12px; stroke:#F7931A; }
  .card h3 { margin:0 0 6px; font-size:16px; }
  .card p { margin:0; font-size:13px; color:#999; }
  .hdr { background:#252525; border:2px solid #333; border-radius:12px; padding:16px 20px; margin-top:40px; display:flex; align-items:center; gap:12px; }
  .hdr svg { width:24px; height:24px; stroke:#F7931A; flex-shrink:0; }
  .hdr .logo { color:#F7931A; font-size:20px; font-weight:700; }
  .hdr .rest { color:#666; margin-left:auto; font-size:14px; }
  .hint { color:#999; margin-top:20px; font-weight:bold; }
</style>
</head>
<body>
<h1>Elige el ícono para oportunidades</h1>
<p style="color:#999;margin-bottom:30px">Hacé click en uno → se actualiza el preview abajo</p>

<div class="grid" id="g"></div>

<h2 style="color:#F7931A;margin-top:40px">Preview en el header</h2>
<div class="hdr" id="hdr">
  <span id="pi">?</span>
  <span class="logo">bittick</span>
  <span style="color:#fff">Bot #44</span>
  <span class="rest">$65.360 | 🔔 | ☰</span>
</div>
<p class="hint" id="st">Seleccionado: —</p>

<script>
var I={
antenna:'<svg viewBox="0 0 24 24" fill="none" stroke="#F7931A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12 7 2"/><path d="m7 12 5-10"/><path d="m12 12 5-10"/><path d="m17 12 5-10"/><path d="M4.5 7h15"/><path d="M12 16v6"/></svg>',
radio:'<svg viewBox="0 0 24 24" fill="none" stroke="#F7931A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16.247 7.761a6 6 0 0 1 0 8.478"/><path d="M19.075 4.933a10 10 0 0 1 0 14.134"/><path d="M4.925 19.067a10 10 0 0 1 0-14.134"/><path d="M7.753 16.239a6 6 0 0 1 0-8.478"/><circle cx="12" cy="12" r="2"/></svg>',
radar:'<svg viewBox="0 0 24 24" fill="none" stroke="#F7931A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19.07 4.93A10 10 0 0 0 6.99 3.34"/><path d="M4 6h.01"/><path d="M2.29 9.62A10 10 0 1 0 21.31 8.35"/><path d="M16.24 7.76A6 6 0 1 0 8.23 16.67"/><path d="M12 18h.01"/><path d="M17.99 11.66A6 6 0 0 1 15.77 16.67"/><circle cx="12" cy="12" r="2"/><path d="m13.41 10.59 5.66-5.66"/></svg>',
radio-tower:'<svg viewBox="0 0 24 24" fill="none" stroke="#F7931A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.9 16.1C1 12.2 1 5.8 4.9 1.9"/><path d="M7.8 4.7a6.14 6.14 0 0 0-.8 7.5"/><circle cx="12" cy="9" r="2"/><path d="M16.2 4.8c2 2 2.26 5.11.8 7.47"/><path d="M19.1 1.9a9.96 9.96 0 0 1 0 14.1"/><path d="M9.5 18h5"/><path d="m8 22 4-11 4 11"/></svg>',
signal:'<svg viewBox="0 0 24 24" fill="none" stroke="#F7931A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 20h.01"/><path d="M7 20v-4"/><path d="M12 20v-8"/><path d="M17 20V8"/><path d="M22 4v16"/></svg>'
};
var N={antenna:'Antenna - Antena con líneas V',radio:'Radio - Ondas circulares',radar:'Radar - Círculos con barrido','radio-tower':'Radio Tower - Torre con ondas',signal:'Signal - 5 barras verticales'};
var g=document.getElementById('g');
Object.keys(I).forEach(function(k){
  var d=document.createElement('div'); d.className='card';
  d.innerHTML=I[k]+'<h3>'+k+'</h3><p>'+N[k]+'</p>';
  d.onclick=function(){
    document.querySelectorAll('.card').forEach(function(c){c.classList.remove('selected')});
    d.classList.add('selected');
    document.getElementById('pi').innerHTML=I[k];
    document.getElementById('st').textContent='Seleccionado: '+k;
  };
  g.appendChild(d);
});
</script>
</body>
</html>
